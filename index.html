let currentLang = 'it';

function setLanguage(lang) {
  for (const [key, value] of Object.entries(translations)) {
    const els = document.querySelectorAll(`[data-translation-key="${key}"]`);
    els.forEach(el => {
      if (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA') {
        el.placeholder = value[lang];
      } else {
        el.innerHTML = value[lang];
      }
    });
  }
  // Update flag: show the flag of the language you will switch to
  const flag = document.getElementById('lang-flag');
  if (lang === 'it') {
    flag.src = 'https://cdn.jsdelivr.net/gh/hjnilsson/country-flags/svg/gb.svg';
    flag.alt = 'English';
  } else {
    flag.src = 'https://cdn.jsdelivr.net/gh/hjnilsson/country-flags/svg/it.svg';
    flag.alt = 'Italiano';
  }
  currentLang = lang;
}

function toggleLanguage() {
  setLanguage(currentLang === 'it' ? 'en' : 'it');
}

document.getElementById('language-toggle').addEventListener('click', toggleLanguage);
window.addEventListener('DOMContentLoaded', () => setLanguage('it'));

// Dark mode toggle
function toggleDarkMode() {
  document.body.classList.toggle('dark-mode');
  const isDarkMode = document.body.classList.contains('dark-mode');
  localStorage.setItem('darkMode', isDarkMode);
  const icon = document.querySelector('#dark-mode-toggle i');
  icon.className = isDarkMode ? 'fa fa-sun-o' : 'fa fa-moon-o';
}

// Initialize dark mode from localStorage
const darkModeEnabled = localStorage.getItem('darkMode') === 'true';
if (darkModeEnabled) {
  document.body.classList.add('dark-mode');
  if (document.querySelector('#dark-mode-toggle i')) {
    document.querySelector('#dark-mode-toggle i').className = 'fa fa-sun-o';
  }
}

document.getElementById('dark-mode-toggle').addEventListener('click', toggleDarkMode);

// PDF Export logic
function exportToPDF() {
  // Hide the export and control buttons for PDF
  document.getElementById('pdf-export').style.display = 'none';
  document.getElementById('language-toggle').style.display = 'none';
  document.getElementById('dark-mode-toggle').style.display = 'none';
  
  // Temporarily remove dark mode to ensure PDF has proper colors
  const wasDarkMode = document.body.classList.contains('dark-mode');
  if (wasDarkMode) {
    document.body.classList.remove('dark-mode');
  }
  
  html2pdf()
    .set({
      margin: 0.5,
      filename: 'CV_Luca_Martinengo.pdf',
      image: { type: 'jpeg', quality: 0.98 },
      html2canvas: { scale: 1 },
      jsPDF: { unit: 'in', format: 'A2', orientation: 'portrait' }
    })
    .from(document.body)
    .save()
    .then(() => {
      // Restore everything
      document.getElementById('pdf-export').style.display = '';
      document.getElementById('language-toggle').style.display = '';
      document.getElementById('dark-mode-toggle').style.display = '';
      if (wasDarkMode) {
        document.body.classList.add('dark-mode');
      }
    })
    .catch((error) => {
      // Restore on error
      document.getElementById('pdf-export').style.display = '';
      document.getElementById('language-toggle').style.display = '';
      document.getElementById('dark-mode-toggle').style.display = '';
      if (wasDarkMode) {
        document.body.classList.add('dark-mode');
      }
      console.error('PDF export failed:', error);
    });
}
document.getElementById('pdf-export').addEventListener('click', exportToPDF);
